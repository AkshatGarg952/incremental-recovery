[project]
name = "incremental-recovery-engine"
version = "0.1.0"
description = "Incremental recovery agent for failed payments, measured against a randomised holdout and baseline arm"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
